[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-pipeline"
version = "1.0.0"
description = "Production-grade Binance historical data pipeline for ClickHouse"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0.1",
    "clickhouse-connect>=0.7.0",
    "tqdm>=4.66.0",
    "structlog>=24.1.0",
    "packaging>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "gymnasium>=0.29.0",
    "torch>=2.0.0",
]

[project.scripts]
quant-plugins = "quant_platform.marketplace.cli:main"
quant-train = "quant_platform.rl_product.training.cli:main"

[project.entry-points."platform.data_providers"]
binance_vision = "quant_platform.plugins.binance_vision:factory"

[project.entry-points."platform.storage_backends"]
clickhouse = "quant_platform.plugins.clickhouse:factory"

[project.entry-points."platform.parsers"]
binance_kline_csv = "quant_platform.plugins.binance_kline_parser:factory"

[project.entry-points."platform.dataset_builders"]
binance_klines_monthly = "quant_platform.plugins.binance_klines_monthly:factory"

[project.entry-points."platform.features"]
ohlc_feature = "quant_platform.plugins.ohlc_feature:factory"
volume_feature = "quant_platform.plugins.volume_feature:factory"
atr_feature = "quant_platform.plugins.atr_feature:factory"
vwap_feature = "quant_platform.plugins.vwap_feature:factory"

[project.entry-points."platform.normalizations"]
symbol_normalizer = "quant_platform.plugins.domain.symbol_normalizer:factory"
z_score = "quant_platform.plugins.domain.z_score:factory"

[project.entry-points."platform.indicators"]
ema_indicator = "quant_platform.plugins.domain.ema_indicator:factory"
rsi_indicator = "quant_platform.plugins.domain.rsi_indicator:factory"
macd_indicator = "quant_platform.plugins.domain.macd_indicator:factory"

[project.entry-points."platform.market_structures"]
bos_choch = "quant_platform.plugins.domain.bos_choch:factory"
fvg = "quant_platform.plugins.domain.fvg:factory"
order_blocks = "quant_platform.plugins.domain.order_blocks:factory"

[project.entry-points."platform.labels"]
direction_label = "quant_platform.plugins.domain.direction_label:factory"
regime_label = "quant_platform.plugins.domain.regime_label:factory"

[project.entry-points."platform.observations"]
candle_observation = "quant_platform.plugins.domain.candle_observation:factory"
portfolio_observation = "quant_platform.plugins.domain.portfolio_observation:factory"
risk_observation = "quant_platform.plugins.domain.risk_observation:factory"

[project.entry-points."platform.rewards"]
profit_reward = "quant_platform.plugins.domain.profit_reward:factory"
sharpe_reward = "quant_platform.plugins.domain.sharpe_reward:factory"
drawdown_penalty = "quant_platform.plugins.domain.drawdown_penalty:factory"

[project.entry-points."platform.actions"]
discrete_action = "quant_platform.plugins.domain.discrete_action:factory"
continuous_action = "quant_platform.plugins.domain.continuous_action:factory"
hybrid_action = "quant_platform.plugins.domain.hybrid_action:factory"

[project.entry-points."platform.environments"]
spot_env = "quant_platform.plugins.domain.spot_env:factory"
futures_env = "quant_platform.plugins.domain.futures_env:factory"

[project.entry-points."platform.strategies"]
rule_based = "quant_platform.plugins.domain.rule_based:factory"
smc_ict = "quant_platform.plugins.domain.smc_ict:factory"

[project.entry-points."platform.executions"]
simulation_execution = "quant_platform.plugins.domain.simulation_execution:factory"

[project.entry-points."platform.risks"]
fixed_risk = "quant_platform.plugins.domain.fixed_risk:factory"
kelly_risk = "quant_platform.plugins.domain.kelly_risk:factory"

[project.entry-points."platform.portfolios"]
single_asset = "quant_platform.plugins.domain.single_asset:factory"
multi_asset = "quant_platform.plugins.domain.multi_asset:factory"

[project.entry-points."platform.exchanges"]
binance_exchange = "quant_platform.plugins.domain.binance_exchange:factory"

[project.entry-points."platform.brokers"]
paper_broker = "quant_platform.plugins.domain.paper_broker:factory"

[project.entry-points."platform.replay_buffers"]
uniform_buffer = "quant_platform.plugins.domain.uniform_buffer:factory"

[project.entry-points."platform.rl_algorithms"]
ppo = "quant_platform.plugins.domain.ppo:factory"
sac = "quant_platform.plugins.domain.sac:factory"

[project.entry-points."platform.training_pipelines"]
standard_rl_train = "quant_platform.plugins.domain.standard_rl_train:factory"

[project.entry-points."platform.evaluation_pipelines"]
walk_forward = "quant_platform.plugins.domain.walk_forward:factory"
holdout_eval = "quant_platform.plugins.domain.holdout_eval:factory"

[project.entry-points."platform.backtesting"]
event_driven = "quant_platform.plugins.domain.event_driven:factory"
vectorized = "quant_platform.plugins.domain.vectorized:factory"

[project.entry-points."platform.paper_trading"]
paper_engine = "quant_platform.plugins.domain.paper_engine:factory"

[project.entry-points."platform.live_trading"]
live_engine = "quant_platform.plugins.domain.live_engine:factory"

[project.entry-points."platform.visualizations"]
equity_curve = "quant_platform.plugins.domain.equity_curve:factory"

[project.entry-points."platform.notifications"]
slack_notifier = "quant_platform.plugins.domain.slack_notifier:factory"

[project.entry-points."platform.monitoring"]
structlog_monitoring = "quant_platform.plugins.domain.structlog_monitoring:factory"
prometheus_metrics = "quant_platform.plugins.domain.prometheus_metrics:factory"

[project.entry-points."platform.configurations"]
schema_config = "quant_platform.plugins.domain.schema_config:factory"

[project.entry-points."platform.rl"]
training_dataset = "quant_platform.plugins.rl.training_dataset:factory"
episode_cache = "quant_platform.plugins.rl.episode_cache:factory"
smc_bos_prob = "quant_platform.plugins.rl.smc_bos_prob:factory"
smc_choch_prob = "quant_platform.plugins.rl.smc_choch_prob:factory"
smc_ob_validity_prob = "quant_platform.plugins.rl.smc_ob_validity_prob:factory"
smc_fvg_fill_prob = "quant_platform.plugins.rl.smc_fvg_fill_prob:factory"
rtm_sd_strength = "quant_platform.plugins.rl.rtm_sd_strength:factory"
rtm_sweep_prob = "quant_platform.plugins.rl.rtm_sweep_prob:factory"
rtm_compression_prob = "quant_platform.plugins.rl.rtm_compression_prob:factory"
rtm_flip_prob = "quant_platform.plugins.rl.rtm_flip_prob:factory"
ict_session_prob = "quant_platform.plugins.rl.ict_session_prob:factory"
ict_killzone_prob = "quant_platform.plugins.rl.ict_killzone_prob:factory"
ict_premium_discount_prob = "quant_platform.plugins.rl.ict_premium_discount_prob:factory"
perception_compressor = "quant_platform.plugins.rl.perception_compressor:factory"
feature_gate = "quant_platform.plugins.rl.feature_gate:factory"
price_action_observation = "quant_platform.plugins.rl.price_action_observation:factory"
execution_model = "quant_platform.plugins.rl.execution_model:factory"
rl_env_spot = "quant_platform.plugins.rl.rl_env_spot:factory"
rl_env_futures = "quant_platform.plugins.rl.rl_env_futures:factory"
ppo_torch = "quant_platform.plugins.rl.ppo_torch:factory"
online_training = "quant_platform.plugins.rl.online_training:factory"
curriculum_scheduler = "quant_platform.plugins.rl.curriculum_scheduler:factory"
walk_forward_rl_eval = "quant_platform.plugins.rl.walk_forward_rl_eval:factory"
ablation_eval = "quant_platform.plugins.rl.ablation_eval:factory"

[tool.setuptools.packages.find]
where = ["."]
include = ["services*", "quant_platform*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"
