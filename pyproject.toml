[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-pipeline"
version = "1.0.0"
description = "Production-grade Binance historical data pipeline for ClickHouse"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0.1",
    "clickhouse-connect>=0.7.0",
    "tqdm>=4.66.0",
    "structlog>=24.1.0",
    "packaging>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
]

[project.entry-points."platform.data_providers"]
binance_vision = "quant_platform.plugins.binance_vision:factory"

[project.entry-points."platform.storage_backends"]
clickhouse = "quant_platform.plugins.clickhouse:factory"

[project.entry-points."platform.parsers"]
binance_kline_csv = "quant_platform.plugins.binance_kline_parser:factory"

[project.entry-points."platform.features"]
ohlc_feature = "quant_platform.plugins.ohlc_feature:factory"
volume_feature = "quant_platform.plugins.volume_feature:factory"
atr_feature = "quant_platform.plugins.atr_feature:factory"
vwap_feature = "quant_platform.plugins.vwap_feature:factory"

[tool.setuptools.packages.find]
where = ["."]
include = ["services*", "quant_platform*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"
