x-platform: &platform
  image: crypto-platform:latest
  build:
    context: .
    dockerfile: docker/platform/Dockerfile
  networks:
    - crypto_net
  volumes:
    - ./config:/config:ro
    - ./downloads:/downloads
    - ./logs:/logs
    - ./data:/app/data
  environment:
    CONFIG_PATH: /config/config.yaml

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: crypto_clickhouse
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    environment:
      CLICKHOUSE_DB: crypto
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ./data/clickhouse:/var/lib/clickhouse
      - ./data/clickhouse-logs:/var/log/clickhouse-server
      - ./docker/clickhouse/init:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - crypto_net

  downloader:
    <<: *platform
    container_name: crypto_downloader
    entrypoint: ["/entrypoint.sh", "downloader"]
    restart: "no"
    profiles:
      - full
      - pipeline
      - download

  importer:
    <<: *platform
    container_name: crypto_importer
    entrypoint: ["/entrypoint.sh", "importer"]
    deploy:
      resources:
        limits:
          memory: 2G
    depends_on:
      clickhouse:
        condition: service_healthy
      downloader:
        condition: service_completed_successfully
        required: false
    restart: "no"
    profiles:
      - full
      - pipeline
      - import

  rl-train:
    <<: *platform
    container_name: crypto_rl_train
    entrypoint: ["/entrypoint.sh", "train"]
    environment:
      TRAIN_CONFIG: ${TRAIN_CONFIG:-/config/training/smoke.yaml}
      TRAIN_STEPS: ${TRAIN_STEPS:-128}
      CHECKPOINT_DIR: /app/data/checkpoints
    depends_on:
      clickhouse:
        condition: service_healthy
      importer:
        condition: service_completed_successfully
        required: false
    restart: "no"
    profiles:
      - full
      - train

  grafana:
    image: grafana/grafana:11.4.0
    container_name: crypto_grafana
    ports:
      - "${GRAFANA_PORT:-3080}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/"
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - crypto_net
    profiles:
      - grafana

networks:
  crypto_net:
    driver: bridge
