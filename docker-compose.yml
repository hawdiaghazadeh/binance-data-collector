services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: crypto_clickhouse
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    environment:
      CLICKHOUSE_DB: crypto
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./docker/clickhouse/init:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - crypto_net

  downloader:
    build:
      context: .
      dockerfile: docker/downloader/Dockerfile
    container_name: crypto_downloader
    environment:
      CONFIG_PATH: /config/config.yaml
    volumes:
      - ./config:/config:ro
      - ./downloads:/downloads
      - ./logs:/logs
    restart: "no"
    networks:
      - crypto_net
    profiles:
      - pipeline
      - download

  importer:
    build:
      context: .
      dockerfile: docker/importer/Dockerfile
    container_name: crypto_importer
    environment:
      CONFIG_PATH: /config/config.yaml
    volumes:
      - ./config:/config:ro
      - ./downloads:/downloads
      - ./logs:/logs
    deploy:
      resources:
        limits:
          memory: 2G
    depends_on:
      clickhouse:
        condition: service_healthy
      downloader:
        condition: service_completed_successfully
        required: false
    restart: "no"
    networks:
      - crypto_net
    profiles:
      - pipeline
      - import

  # Future services — uncomment and implement when ready:
