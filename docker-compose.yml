services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: crypto_clickhouse
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    environment:
      CLICKHOUSE_DB: crypto
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./docker/clickhouse/init:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - crypto_net

  downloader:
    build:
      context: .
      dockerfile: docker/downloader/Dockerfile
    container_name: crypto_downloader
    environment:
      CONFIG_PATH: /config/config.yaml
    volumes:
      - ./config:/config:ro
      - ./downloads:/downloads
      - ./logs:/logs
    restart: "no"
    networks:
      - crypto_net
    profiles:
      - pipeline
      - download

  importer:
    build:
      context: .
      dockerfile: docker/importer/Dockerfile
    container_name: crypto_importer
    environment:
      CONFIG_PATH: /config/config.yaml
    volumes:
      - ./config:/config:ro
      - ./downloads:/downloads
      - ./logs:/logs
    deploy:
      resources:
        limits:
          memory: 2G
    depends_on:
      clickhouse:
        condition: service_healthy
      downloader:
        condition: service_completed_successfully
        required: false
    restart: "no"
    networks:
      - crypto_net
    profiles:
      - pipeline
      - import

  grafana:
    image: grafana/grafana:11.4.0
    container_name: crypto_grafana
    ports:
      - "${GRAFANA_PORT:-3080}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: 'no'
    networks:
      - crypto_net

volumes:
  clickhouse_data:
  clickhouse_logs:
  grafana_data:

networks:
  crypto_net:
    driver: bridge
