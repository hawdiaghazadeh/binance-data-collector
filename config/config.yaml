  - 5m
  - 15m
  - 30m
  - 1h
  - 2h
  - 4h
  - 6h
  - 8h
  - 12h
  - 1d
  - 3d
  - 1w
  - 1mo

paths:
  download_dir: "/downloads"
  logs_dir: "/logs"
  state_dir: "/downloads/.state"

database:
  host: "clickhouse"
  port: 8123
  native_port: 9000
  user: "default"
  password: ""
  database: "crypto"
  table: "klines"
  import_state_table: "import_state"
  connect_timeout: 30
  send_receive_timeout: 300
  compression: true

downloader:
  max_concurrent: 8
  retry_count: 5
  retry_backoff_seconds: 2.0
  retry_backoff_multiplier: 2.0
  request_timeout_seconds: 120
  verify_checksum: true
  chunk_size_bytes: 1048576  # 1 MB

importer:
  max_workers: 1
  batch_size: 25000
  retry_count: 3
  retry_backoff_seconds: 2.0
  delete_after_import: false
  validate_gaps: true
  serial_import: true
  strict_validation: true
  rollback_on_failure: true

logging:
  level: "INFO"
  json_logs: false
  log_to_file: true
